# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"
tone_instructions: "Be concise, analytical, and prioritize high-signal code quality, PHP 8.2 compatibility, CodeIgniter 4 patterns, database transaction safety, and performance."
early_access: false
reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "staging"
      - "main"
chat:
  auto_reply: true
